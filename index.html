<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Vista Specials — Hex Vault</title>
<style>
  :root{
    --bg:#0e0b09;
    --bg-2:#18130f;
    --tile-a:#241b14;
    --tile-b:#2c211a;
    --cream:#f1e6c9;
    --gold:#c79a48;
    --wine-light:#c4495c;
    --muted:#9c8f7f;
    --scrim: rgba(10,7,5,0.86);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 30% 20%, #1c150f 0%, var(--bg) 55%),
      var(--bg);
    color:var(--cream);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
    height:100vh;
    width:100vw;
  }

  .frame{
    position:relative;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
  }

  .masthead{
    position:relative;
    z-index:5;
    padding:22px 28px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(14,11,9,0.94) 0%, rgba(14,11,9,0) 100%);
  }
  .masthead h1{
    margin:0;
    font-family:Cambria, "Times New Roman", serif;
    font-weight:700;
    font-size:clamp(20px,3vw,30px);
    letter-spacing:0.02em;
    text-wrap:balance;
    color:var(--cream);
  }
  .masthead h1 em{
    font-style:normal;
    color:var(--gold);
  }
  .masthead .hint{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:right;
    line-height:1.5;
  }

  .stage{
    position:relative;
    flex:1;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
  }
  .stage.dragging{cursor:grabbing;}

  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 60px 70px -50px var(--bg), inset 0 -80px 90px -50px var(--bg);
  }

  .comb{
    position:absolute;
    left:0;
    top:0;
    will-change:transform;
  }

  .hex{
    position:absolute;
    width:var(--hw);
    height:var(--hh);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hex-face{
    width:100%;
    height:100%;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.35));
    background: linear-gradient(155deg, var(--tile-b) 0%, var(--tile-a) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition: filter 0.18s ease, transform 0.15s ease;
  }
  .hex-face:hover{
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.35)) brightness(1.18);
  }
  .hex-face:active{
    transform: scale(0.96);
  }
  .hex.hidden-src .hex-face{ visibility:hidden; }

  .mini{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:0 12%;
    text-align:center;
  }
  .mini span{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--gold);
    line-height:1.35;
    white-space:nowrap;
  }

  .scrim{
    position:fixed;
    inset:0;
    background:var(--scrim);
    opacity:0;
    transition:opacity 0.32s ease;
    z-index:40;
  }
  .scrim.on{ opacity:1; }

  .card{
    position:fixed;
    z-index:50;
    background: linear-gradient(155deg, var(--tile-b) 0%, var(--tile-a) 100%);
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    transition: left 0.42s cubic-bezier(.2,.8,.2,1), top 0.42s cubic-bezier(.2,.8,.2,1),
                width 0.42s cubic-bezier(.2,.8,.2,1), height 0.42s cubic-bezier(.2,.8,.2,1),
                clip-path 0.42s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card.open{
    clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 100% 100%, 0% 100%, 0% 50%);
  }

  .card-photo{
    width:100%;
    height:var(--photo-h, 55%);
    flex:none;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 0.28s ease, height 0.42s cubic-bezier(.2,.8,.2,1);
  }
  .card.open .card-photo{ opacity:1; transition-delay:0.1s; }

  .card-inner{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:20px 24px;
    opacity:0;
    transition:opacity 0.2s ease;
  }
  .card.open .card-inner{ opacity:1; transition-delay:0.16s; }

  .card-close{
    position:absolute;
    top:14px;
    right:14px;
    width:32px;
    height:32px;
    border:1px solid rgba(241,230,201,0.25);
    background:rgba(14,11,9,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;
    transition:opacity 0.2s ease, background 0.15s ease;
  }
  .card.open .card-close{ opacity:1; transition-delay:0.2s; }
  .card-close:hover{ background:rgba(140,29,43,0.6); }
  .card-close .x{position:relative;width:12px;height:12px;}
  .card-close .x::before,.card-close .x::after{
    content:"";position:absolute;top:5px;left:0;width:12px;height:2px;background:var(--cream);
  }
  .card-close .x::before{ transform:rotate(45deg); }
  .card-close .x::after{ transform:rotate(-45deg); }

  .card-eyebrow{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 8px;
  }
  .card-title{
    font-family:Cambria, "Times New Roman", serif;
    font-weight:700;
    font-size:clamp(20px,3.2vw,30px);
    margin:0 0 6px;
    color:var(--cream);
    text-wrap:balance;
  }
  .card-sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 18px;
    line-height:1.5;
  }
  .card-price-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .card-price{
    font-size:clamp(24px,3.4vw,34px);
    font-weight:700;
    color:var(--wine-light);
    font-variant-numeric:tabular-nums;
  }
  .card-price-note{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  @media (prefers-reduced-motion: reduce){
    .card, .card-inner, .card-close, .comb, .hex-face{ transition-duration:0.001s !important; }
  }
</style>
</head>
<body>

</div>

  var originX = 0, originY = 0, startX = 0, startY = 0, dragging = false, didDrag = false;

  function clamp(val, min, max){ return Math.max(min, Math.min(max, val)); }

  function applyBounds(x, y){
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var minX = Math.min(0, sw - combWidth - 20);
    var minY = Math.min(0, sh - combHeight - 20);
    return { x: clamp(x, minX, 20), y: clamp(y, minY, 20) };
  }

  function setTranslate(x, y){
    comb.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    comb.dataset.x = x;
    comb.dataset.y = y;
  }

  (function initPosition(){
    var sw = stage.clientWidth || 900, sh = stage.clientHeight || 600;
    var targetCol = Math.floor(COLS / 2), targetRow = Math.floor(ROWS / 2);
    var targetX = targetCol * colSpacing, targetY = targetRow * rowSpacing;
    var pos = applyBounds(sw / 2 - targetX - HW / 2, sh / 2 - targetY - HH / 2);
    setTranslate(pos.x, pos.y);
  })();

  function pointerDown(e){
    dragging = true; didDrag = false;
    stage.classList.add('dragging');
    var p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    originX = parseFloat(comb.dataset.x || 0);
    originY = parseFloat(comb.dataset.y || 0);
  }
  function pointerMove(e){
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    var dx = p.clientX - startX, dy = p.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) didDrag = true;
    var pos = applyBounds(originX + dx, originY + dy);
    setTranslate(pos.x, pos.y);
  }
  function pointerUp(){
    dragging = false;
    stage.classList.remove('dragging');
    setTimeout(function(){ didDrag = false; }, 0);
  }

  stage.addEventListener('touchstart', pointerDown, {passive:true});
  window.addEventListener('touchmove', pointerMove, {passive:true});
  window.addEventListener('touchend', pointerUp);

  // ---- expand / collapse ----
  var scrimEl = null, cardEl = null, activeTile = null;

  function openCard(tile){
    if (cardEl) return;
    var data = SPECIALS[tile.dataset.special];
    var rect = tile.getBoundingClientRect();
    activeTile = tile;
    tile.classList.add('hidden-src');

    scrimEl = document.createElement('div');
    scrimEl.className = 'scrim';
    document.body.appendChild(scrimEl);
    scrimEl.addEventListener('click', closeCard);

    cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.style.left = rect.left + 'px';
    cardEl.style.top = rect.top + 'px';
    cardEl.style.width = rect.width + 'px';
    cardEl.style.height = rect.height + 'px';

    var photo = document.createElement('div');
    photo.className = 'card-photo';
    photo.style.backgroundImage = 'url(' + data.image + ')';
    cardEl.appendChild(photo);

    var closeBtn = document.createElement('div');
    closeBtn.className = 'card-close';
    closeBtn.setAttribute('role', 'button');
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.innerHTML = '<span class="x"></span>';
    cardEl.appendChild(closeBtn);

    var inner = document.createElement('div');
    inner.className = 'card-inner';
    inner.innerHTML =
      '<p class="card-eyebrow">' + data.eyebrow + '</p>' +
      '<h2 class="card-title">' + data.title + '</h2>' +
      '<p class="card-sub">' + data.sub + '</p>' +
      '<div class="card-price-row"><span class="card-price">' + data.price + '</span><span class="card-price-note">' + data.priceNote + '</span></div>';
    cardEl.appendChild(inner);
    document.body.appendChild(cardEl);

    closeBtn.addEventListener('click', function(ev){
      ev.stopPropagation();
      closeCard();
    });

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        scrimEl.classList.add('on');
        cardEl.classList.add('open');
        var vw = window.innerWidth, vh = window.innerHeight;
        var maxW = Math.min(400, vw * 0.88);
        var maxH = vh * 0.86;
        var textH = 190;
        var ratio = data.ratio || 1;
        var w = maxW;
        var photoH = w / ratio;
        if (photoH + textH > maxH){
          photoH = maxH - textH;
          w = photoH * ratio;
        }
        var h = photoH + textH;
        cardEl.style.left = ((vw - w) / 2) + 'px';
        cardEl.style.top = ((vh - h) / 2) + 'px';
        cardEl.style.width = w + 'px';
        cardEl.style.height = h + 'px';
        photo.style.height = photoH + 'px';
      });
    });

    document.addEventListener('keydown', escHandler);
  }

  function closeCard(){
    if (!cardEl || !activeTile) return;
    var rect = activeTile.getBoundingClientRect();
    cardEl.classList.remove('open');
    scrimEl.classList.remove('on');
    cardEl.style.left = rect.left + 'px';
    cardEl.style.top = rect.top + 'px';
    cardEl.style.width = rect.width + 'px';
    cardEl.style.height = rect.height + 'px';

    var doneCard = cardEl, doneScrim = scrimEl, doneTile = activeTile;
    cardEl = null; scrimEl = null; activeTile = null;
    document.removeEventListener('keydown', escHandler);

    setTimeout(function(){
      doneCard.remove();
      doneScrim.remove();
      doneTile.classList.remove('hidden-src');
    }, 440);
  }

  function escHandler(e){
    if (e.key === 'Escape') closeCard();
  }
})();
</script>
</body>
</html>
